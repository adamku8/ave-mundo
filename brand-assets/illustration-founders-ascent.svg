<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="founderShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.12"/>
                </filter>
            </defs>
            <!-- Subtle horizon line -->
            <line x1="0" y1="190" x2="320" y2="190" stroke="currentColor" stroke-width="1" opacity="0.15"/>
            <!-- 4 ascending lines fanning toward top-right -->
            <g stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5" filter="url(#founderShadow)">
                <path d="M 24 184 Q 80 150, 124 100 T 220 36"/>
                <path d="M 56 184 Q 110 140, 158 84 T 254 28"/>
                <path d="M 88 184 Q 142 138, 196 92 T 286 48"/>
                <path d="M 120 184 Q 176 144, 230 104 T 304 64"/>
            </g>
            <!-- Waypoint markers -->
            <g fill="currentColor" opacity="0.85">
                <circle cx="124" cy="100" r="3"/>
                <circle cx="196" cy="92" r="2.4"/>
                <circle cx="254" cy="28" r="3"/>
                <circle cx="220" cy="36" r="2.4"/>
            </g>
            <!-- Apex / summit triangle (small, references A geometry) -->
            <g fill="currentColor" filter="url(#founderShadow)">
                <path d="M 254 28 L 264 10 L 274 28 Z"/>
            </g>
        </svg>