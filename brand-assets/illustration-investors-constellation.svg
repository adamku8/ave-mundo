<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <filter id="investorShadow" x="-20%" y="-20%" width="140%" height="140%">
                    <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.14"/>
                </filter>
            </defs>
            <!-- Concentric guide ring -->
            <g stroke="currentColor" stroke-width="1" fill="none" opacity="0.18" stroke-dasharray="3 5">
                <circle cx="160" cy="100" r="78"/>
            </g>
            <!-- Connection lines from center to satellites -->
            <g stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5">
                <line x1="160" y1="84" x2="160" y2="34"/>
                <line x1="173" y1="93" x2="232" y2="56"/>
                <line x1="174" y1="106" x2="252" y2="124"/>
                <line x1="166" y1="116" x2="198" y2="170"/>
                <line x1="148" y1="113" x2="86" y2="148"/>
                <line x1="146" y1="93" x2="68" y2="62"/>
            </g>
            <!-- Center holding node — bigger, with shadow -->
            <g filter="url(#investorShadow)">
                <circle cx="160" cy="100" r="15" fill="white" stroke="currentColor" stroke-width="1.6"/>
            </g>
            <circle cx="160" cy="100" r="4.5" fill="currentColor"/>
            <!-- Satellite portfolio nodes — outlined, with shadows -->
            <g fill="white" stroke="currentColor" stroke-width="1.5" filter="url(#investorShadow)">
                <circle cx="160" cy="28" r="8"/>
                <circle cx="240" cy="50" r="7"/>
                <circle cx="260" cy="130" r="8.5"/>
                <circle cx="202" cy="178" r="6.5"/>
                <circle cx="80" cy="155" r="8"/>
                <circle cx="62" cy="55" r="7"/>
            </g>
            <!-- Inner dots -->
            <g fill="currentColor" opacity="0.7">
                <circle cx="160" cy="28" r="2"/>
                <circle cx="240" cy="50" r="1.6"/>
                <circle cx="260" cy="130" r="2.2"/>
                <circle cx="202" cy="178" r="1.5"/>
                <circle cx="80" cy="155" r="2"/>
                <circle cx="62" cy="55" r="1.6"/>
            </g>
        </svg>